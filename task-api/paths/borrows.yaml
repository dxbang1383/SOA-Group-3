borrows:
  get:
    tags: [Borrows]
    summary: Lấy danh sách phiếu mượn
    operationId: listBorrows
    responses:
      '200':
        description: Lấy danh sách thành công.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/BorrowList'
            example:
              data:
                - id: 1
                  book_id: 1
                  borrower: Nguyen Van A
                  status: borrowed
                  borrow_date: '2026-10-11T09:00:00Z'
              total: 1
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
  post:
    tags: [Borrows]
    summary: Tạo phiếu mượn
    operationId: createBorrow
    requestBody:
      $ref: '../components/request-bodies.yaml#/BorrowWrite'
    responses:
      '201':
        description: Tạo phiếu mượn thành công.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Borrow'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

borrow_by_id:
  parameters:
    - $ref: '../components/parameters.yaml#/BorrowId'
  get:
    tags: [Borrows]
    summary: Lấy thông tin phiếu mượn
    operationId: getBorrow
    responses:
      '200':
        description: Tìm thấy phiếu mượn.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Borrow'
      '404':
        $ref: '../components/responses.yaml#/BorrowNotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
  put:
    tags: [Borrows]
    summary: Thay thế thông tin phiếu mượn
    operationId: updateBorrow
    requestBody:
      $ref: '../components/request-bodies.yaml#/BorrowWrite'
    responses:
      '200':
        description: Cập nhật phiếu mượn thành công.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Borrow'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/BorrowNotFound'
      '415':
        $ref: '../components/responses.yaml#/UnsupportedMediaType'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
  delete:
    tags: [Borrows]
    summary: Xóa phiếu mượn
    operationId: deleteBorrow
    responses:
      '204':
        description: Xóa thành công; response không có nội dung.
      '404':
        $ref: '../components/responses.yaml#/BorrowNotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'